name: deploy

on:
  workflow_dispatch:

concurrency:
  group: basic-rl-model-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: Terraform Apply + первый расчёт
  # ═══════════════════════════════════════════════════════════════
  deploy_run_1:
    name: Deploy run 1
    runs-on: ubuntu-latest
    env:
      TF_DIR: infra/terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync repository before deploy
        run: |
          set -e
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client tar curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.15.11
          ansible-galaxy collection install ansible.posix

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_BASE64 }}" | base64 -d > ~/.ssh/baseline_model_id_rsa
          chmod 600 ~/.ssh/baseline_model_id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/baseline_model_id_rsa.pub
          chmod 644 ~/.ssh/baseline_model_id_rsa.pub
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/baseline_model_id_rsa
            IdentitiesOnly yes
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          ssh-keygen -y -f ~/.ssh/baseline_model_id_rsa > /dev/null 2>&1

      - name: Create terraform.tfvars
        run: |
          cat > $TF_DIR/terraform.tfvars <<EOF
          yc_token       = "${{ secrets.YC_TOKEN }}"
          yc_cloud_id    = "${{ secrets.YC_CLOUD_ID }}"
          yc_folder_id   = "${{ secrets.YC_FOLDER_ID }}"
          zone           = "ru-central1-a"
          ssh_public_key = "${{ secrets.SSH_PUBLIC_KEY }}"
          EOF

      - name: Terraform Init
        run: |
          cd $TF_DIR
          terraform init

      - name: Terraform Validate
        run: |
          cd $TF_DIR
          terraform validate

      - name: Terraform Apply
        run: |
          cd $TF_DIR
          terraform apply -auto-approve

      - name: Upload Terraform state
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: |
            ${{ env.TF_DIR }}/.terraform/
            ${{ env.TF_DIR }}/terraform.tfstate
            ${{ env.TF_DIR }}/terraform.tfstate.backup
            ${{ env.TF_DIR }}/.terraform.lock.hcl
          retention-days: 1
          overwrite: true

      - name: Get VM IP
        id: vm-ip
        run: |
          IP=$(cd $TF_DIR && terraform output -raw vm_external_ip)
          echo "VM_IP=$IP" >> $GITHUB_OUTPUT
          echo "VM IP: $IP"

      - name: Wait for SSH
        run: |
          IP="${{ steps.vm-ip.outputs.VM_IP }}"
          for i in {1..40}; do
            if ssh -i ~/.ssh/baseline_model_id_rsa -o StrictHostKeyChecking=no -o ConnectTimeout=10 ubuntu@$IP 'echo SSH OK'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Create Ansible inventory
        run: |
          mkdir -p infra/ansible/inventory/production
          cat > infra/ansible/inventory/production/hosts.ini <<EOF
          [mlops]
          ${{ steps.vm-ip.outputs.VM_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=/home/runner/.ssh/baseline_model_id_rsa ansible_ssh_common_args="-o ServerAliveInterval=10 -o ServerAliveCountMax=2160"
          EOF

      - name: Run Ansible deploy (full — includes setup)
        run: |
          ansible-playbook -i infra/ansible/inventory/production/hosts.ini infra/ansible/playbooks/deploy.yml

      - name: Unpack results archive
        run: |
          rm -rf /tmp/results_unpack
          mkdir -p /tmp/results_unpack
          tar -xzf /tmp/basic_rl_model_results.tar.gz -C /tmp/results_unpack

      - name: Copy results
        run: |
          mkdir -p artifacts/data_output 
          rsync -a --delete /tmp/results_unpack/artifacts/data_output/ artifacts/data_output/

      - name: Commit results and updated input
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add artifacts/data_output
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add batch calculation results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: Второй расчёт
  # ═══════════════════════════════════════════════════════════════
  deploy_run_2:
    name: Deploy run 2
    runs-on: ubuntu-latest
    needs: deploy_run_1
    env:
      TF_DIR: infra/terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync repository before deploy
        run: |
          set -e
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client tar curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.15.11
          ansible-galaxy collection install ansible.posix

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_BASE64 }}" | base64 -d > ~/.ssh/baseline_model_id_rsa
          chmod 600 ~/.ssh/baseline_model_id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/baseline_model_id_rsa.pub
          chmod 644 ~/.ssh/baseline_model_id_rsa.pub
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/baseline_model_id_rsa
            IdentitiesOnly yes
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          ssh-keygen -y -f ~/.ssh/baseline_model_id_rsa > /dev/null 2>&1

      - name: Download Terraform state
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: ${{ env.TF_DIR }}

      - name: Get VM IP from state
        id: vm-ip
        run: |
          IP=$(cd $TF_DIR && terraform output -raw vm_external_ip)
          echo "VM_IP=$IP" >> $GITHUB_OUTPUT
          echo "VM IP: $IP"

      - name: Create Ansible inventory
        run: |
          mkdir -p infra/ansible/inventory/production
          cat > infra/ansible/inventory/production/hosts.ini <<EOF
          [mlops]
          ${{ steps.vm-ip.outputs.VM_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=/home/runner/.ssh/baseline_model_id_rsa ansible_ssh_common_args="-o ServerAliveInterval=10 -o ServerAliveCountMax=2160"
          EOF

      - name: Run Ansible deploy (full — includes setup)
        run: |
          ansible-playbook -i infra/ansible/inventory/production/hosts.ini infra/ansible/playbooks/deploy.yml

      - name: Unpack results archive
        run: |
          rm -rf /tmp/results_unpack
          mkdir -p /tmp/results_unpack
          tar -xzf /tmp/basic_rl_model_results.tar.gz -C /tmp/results_unpack

      - name: Copy results and updated input into repository
        run: |
          mkdir -p artifacts/data_output
          rsync -a --delete /tmp/results_unpack/artifacts/data_output/ artifacts/data_output/

      - name: Commit results
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add artifacts/data_output
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add batch calculation results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: Третий расчёт
  # ═══════════════════════════════════════════════════════════════
  deploy_run_3:
    name: Deploy run 3
    runs-on: ubuntu-latest
    needs: deploy_run_2
    env:
      TF_DIR: infra/terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync repository before deploy
        run: |
          set -e
          git fetch origin "${GITHUB_REF_NAME}"
          git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client tar curl

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core==2.15.11
          ansible-galaxy collection install ansible.posix

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_BASE64 }}" | base64 -d > ~/.ssh/baseline_model_id_rsa
          chmod 600 ~/.ssh/baseline_model_id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/baseline_model_id_rsa.pub
          chmod 644 ~/.ssh/baseline_model_id_rsa.pub
          cat > ~/.ssh/config << 'EOF'
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentityFile ~/.ssh/baseline_model_id_rsa
            IdentitiesOnly yes
            LogLevel ERROR
          EOF
          chmod 600 ~/.ssh/config
          ssh-keygen -y -f ~/.ssh/baseline_model_id_rsa > /dev/null 2>&1

      - name: Download Terraform state
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: ${{ env.TF_DIR }}

      - name: Get VM IP from state
        id: vm-ip
        run: |
          IP=$(cd $TF_DIR && terraform output -raw vm_external_ip)
          echo "VM_IP=$IP" >> $GITHUB_OUTPUT
          echo "VM IP: $IP"

      - name: Create Ansible inventory
        run: |
          mkdir -p infra/ansible/inventory/production
          cat > infra/ansible/inventory/production/hosts.ini <<EOF
          [mlops]
          ${{ steps.vm-ip.outputs.VM_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=/home/runner/.ssh/baseline_model_id_rsa ansible_ssh_common_args="-o ServerAliveInterval=10 -o ServerAliveCountMax=2160"
          EOF

      - name: Run Ansible deploy (full — includes setup)
        run: |
          ansible-playbook -i infra/ansible/inventory/production/hosts.ini infra/ansible/playbooks/deploy.yml

      - name: Unpack results archive
        run: |
          rm -rf /tmp/results_unpack
          mkdir -p /tmp/results_unpack
          tar -xzf /tmp/basic_rl_model_results.tar.gz -C /tmp/results_unpack

      - name: Copy results and updated input into repository
        run: |
          mkdir -p artifacts/data_output artifacts/data_input
          rsync -a --delete /tmp/results_unpack/artifacts/data_output/ artifacts/data_output/

      - name: Commit results
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add artifacts/data_output 
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add batch calculation results"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # ═══════════════════════════════════════════════════════════════
  # JOB 4: Terraform Destroy (всегда, после deploy_run_3)
  # ═══════════════════════════════════════════════════════════════
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: deploy_run_3
    if: always()
    env:
      TF_DIR: infra/terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Create terraform.tfvars
        run: |
          cat > $TF_DIR/terraform.tfvars <<EOF
          yc_token       = "${{ secrets.YC_TOKEN }}"
          yc_cloud_id    = "${{ secrets.YC_CLOUD_ID }}"
          yc_folder_id   = "${{ secrets.YC_FOLDER_ID }}"
          zone           = "ru-central1-a"
          ssh_public_key = "${{ secrets.SSH_PUBLIC_KEY }}"
          EOF

      - name: Download Terraform state
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: ${{ env.TF_DIR }}
        continue-on-error: true
        id: dl_state

      - name: Terraform Init
        if: steps.dl_state.outcome != 'failed'
        run: |
          cd $TF_DIR
          terraform init

      - name: Terraform Destroy
        if: steps.dl_state.outcome != 'failed'
        run: |
          cd $TF_DIR
          terraform destroy -auto-approve

      - name: Report missing state
        if: steps.dl_state.outcome != 'success'
        run: |
          echo "::warning::Terraform state not found — VM may still be running and needs manual cleanup"
